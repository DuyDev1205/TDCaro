name: Web (GitHub Pages)

# Build ban web (pygbag / WebAssembly) va dang len https://duydev1205.github.io/TDCaro/
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pygbag
        run: pip install pygbag==0.9.3
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/set_version.py "${GITHUB_REF_NAME#v}"
      - name: Build web
        run: python tools/build_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
